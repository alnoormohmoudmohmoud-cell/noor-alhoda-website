<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم - مدرسة نور الهدى</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0f2a45;
    --navy-deep:#0a1d31;
    --gold:#b8912a;
    --teal:#155852;
    --paper:#f6f1e5;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif;}
  body{ background:var(--paper); color:#241f18; }

  /* شاشة تسجيل الدخول */
  #loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--navy-deep);
    padding:20px;
  }
  .login-box{
    background:#fff;
    padding:36px 28px;
    border-radius:12px;
    max-width:360px;
    width:100%;
    text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,.3);
  }
  .login-box h1{ color:var(--navy); font-size:22px; margin-bottom:6px; }
  .login-box p.sub{ color:#777; font-size:13px; margin-bottom:22px; }
  .login-box input{
    width:100%;
    padding:12px 14px;
    margin:8px 0;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
  }
  .login-box button{
    width:100%;
    background:var(--navy);
    color:#fff;
    border:none;
    padding:13px;
    border-radius:8px;
    font-size:15px;
    font-weight:700;
    margin-top:10px;
    cursor:pointer;
  }
  .login-box button:hover{ background:var(--navy-deep); }

  /* لوحة التحكم */
  #dashboard{ display:none; }
  header{
    background:var(--navy);
    color:#fff;
    padding:16px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  header h1{ font-size:18px; }
  #logoutBtn{
    background:transparent;
    border:1px solid rgba(255,255,255,.4);
    color:#fff;
    padding:8px 16px;
    border-radius:6px;
    cursor:pointer;
    font-size:13px;
  }
  main{ padding:30px 5%; max-width:800px; margin:0 auto; }
  .tabs{ display:flex; gap:8px; margin-bottom:24px; flex-wrap:wrap; }
  .tab-btn{
    background:#e8e1cd;
    border:none;
    padding:10px 18px;
    border-radius:20px;
    cursor:pointer;
    font-size:14px;
    font-weight:600;
    color:#555;
  }
  .tab-btn.active{ background:var(--gold); color:#fff; }
  .panel{ display:none; }
  .panel.active{ display:block; }

  .card{
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,.06);
    margin-bottom:16px;
  }
  .card h3{ color:var(--navy); margin-bottom:14px; font-size:17px; }
  input, select{
    width:100%;
    padding:11px 13px;
    margin:6px 0;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:14px;
  }
  .btn-save{
    background:var(--teal);
    color:#fff;
    border:none;
    padding:11px 24px;
    border-radius:8px;
    cursor:pointer;
    font-weight:700;
    margin-top:8px;
  }
  .btn-save:hover{ background:#0f423d; }

  .entry-row{
    background:#f8f5e9;
    border-right:4px solid var(--teal);
    padding:12px 16px;
    margin:8px 0;
    border-radius:6px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .entry-row .info{ font-size:14px; }
  .entry-row .info b{ color:var(--navy); }
  .del-btn{
    background:#c62828;
    color:#fff;
    border:none;
    padding:7px 14px;
    border-radius:6px;
    font-size:12px;
    cursor:pointer;
  }
  .del-btn:hover{ background:#a01d1d; }
  .empty-msg{ text-align:center; color:#888; padding:20px; }

  .status-badge{
    display:inline-block;
    padding:3px 10px;
    border-radius:12px;
    font-size:12px;
    font-weight:700;
    margin-right:6px;
  }
  .status-pending{ background:#fff3cd; color:#856404; }
  .status-accepted{ background:#d4edda; color:#155724; }
  .status-rejected{ background:#f8d7da; color:#721c24; }

  .action-buttons{ display:flex; gap:6px; flex-wrap:wrap; }
  .accept-btn{
    background:var(--teal); color:#fff; border:none;
    padding:7px 14px; border-radius:6px; font-size:12px; cursor:pointer;
  }
  .accept-btn:hover{ background:#0f423d; }
  .reject-btn{
    background:#8a6d1f; color:#fff; border:none;
    padding:7px 14px; border-radius:6px; font-size:12px; cursor:pointer;
  }
  .reject-btn:hover{ background:#6d5518; }
  .whatsapp-btn{
    background:#25D366; color:#fff; border:none;
    padding:7px 14px; border-radius:6px; font-size:12px; cursor:pointer;
    text-decoration:none; display:inline-block;
  }
  .whatsapp-btn:hover{ background:#1ea952; }

  .gallery-item{
    position:relative;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
  }
  .gallery-item img{
    width:100%;
    height:110px;
    object-fit:cover;
    display:block;
  }
  .gallery-item .del-btn{
    position:absolute;
    top:6px;
    left:6px;
    padding:4px 9px;
    font-size:11px;
  }

  /* ---------- إشعارات Toast ---------- */
  #toastContainer{
    position:fixed;
    top:16px;
    left:50%;
    transform:translateX(-50%);
    z-index:3000;
    display:flex;
    flex-direction:column;
    gap:10px;
    width:min(92vw,380px);
  }
  .toast{
    background:var(--navy);
    color:#fff;
    padding:14px 18px;
    border-radius:10px;
    font-size:14px;
    box-shadow:0 10px 28px rgba(0,0,0,.3);
    display:flex;
    align-items:center;
    gap:10px;
    opacity:0;
    transform:translateY(-14px);
    transition:opacity .25s, transform .25s;
    border-right:4px solid var(--gold);
  }
  .toast.show{ opacity:1; transform:translateY(0); }
  .toast.success{ border-right-color:#2e7d32; }
  .toast.error{ border-right-color:#c62828; }

  .spinner{
    display:inline-block;
    width:14px;height:14px;
    border:2px solid rgba(255,255,255,.3);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .7s linear infinite;
    vertical-align:middle;
    margin-left:6px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>

<!-- ============ شاشة تسجيل الدخول ============ -->
<div id="loginScreen">
  <div class="login-box">
    <h1>لوحة تحكم المدرسة</h1>
    <p class="sub">مدرسة نور الهدى الأساسية المختلطة</p>
    <input type="email" id="emailInput" placeholder="البريد الإلكتروني">
    <input type="password" id="passwordInput" placeholder="كلمة المرور">
    <button id="loginBtn">تسجيل الدخول</button>
  </div>
</div>

<!-- ============ لوحة التحكم ============ -->
<div id="dashboard">
  <header>
    <h1>لوحة تحكم مدرسة نور الهدى</h1>
    <button id="logoutBtn">تسجيل خروج</button>
  </header>

  <main>
    <div class="tabs">
      <button class="tab-btn active" data-tab="resultsTab">إضافة نتيجة</button>
      <button class="tab-btn" data-tab="registrationsTab">طلبات التسجيل</button>
      <button class="tab-btn" data-tab="newsTab">الأخبار</button>
      <button class="tab-btn" data-tab="galleryTab">المعرض</button>
    </div>

    <!-- تبويب: إضافة نتيجة -->
    <div class="panel active" id="resultsTab">
      <div class="card">
        <h3>إضافة / تحديث نتيجة طالب</h3>
        <input type="text" id="seatIdInput" placeholder="رقم الجلوس">
        <input type="text" id="resStudentName" placeholder="اسم الطالب">
        <input type="text" id="resGrade" placeholder="الصف الدراسي">
        <select id="resStatus">
          <option value="ناجح">ناجح</option>
          <option value="ناجح بمواد">ناجح بمواد</option>
          <option value="راسب">راسب</option>
          <option value="دور ثاني">دور ثاني</option>
        </select>
        <button class="btn-save" id="saveResultBtn">حفظ النتيجة</button>
      </div>

      <div class="card">
        <h3>كل النتائج المضافة</h3>
        <div id="resultsListAdmin"><p class="empty-msg">جاري التحميل...</p></div>
      </div>
    </div>

    <!-- تبويب: طلبات التسجيل -->
    <div class="panel" id="registrationsTab">
      <div class="card">
        <h3>طلبات التسجيل الواردة</h3>
        <div id="registrationsListAdmin"><p class="empty-msg">جاري التحميل...</p></div>
      </div>
    </div>

    <!-- تبويب: الأخبار -->
    <div class="panel" id="newsTab">
      <div class="card">
        <h3>إضافة خبر جديد</h3>
        <input type="text" id="newsTitle" placeholder="عنوان الخبر">
        <textarea id="newsBody" placeholder="نص الخبر" rows="3" style="width:100%;padding:11px 13px;margin:6px 0;border:1px solid #ddd;border-radius:8px;font-size:14px;font-family:'Cairo',sans-serif;"></textarea>
        <button class="btn-save" id="saveNewsBtn">نشر الخبر</button>
      </div>

      <div class="card">
        <h3>الأخبار المنشورة</h3>
        <div id="newsListAdmin"><p class="empty-msg">جاري التحميل...</p></div>
      </div>
    </div>

    <!-- تبويب: المعرض -->
    <div class="panel" id="galleryTab">
      <div class="card">
        <h3>إضافة صورة جديدة</h3>
        <input type="file" id="galleryFileInput" accept="image/*">
        <input type="text" id="galleryCaption" placeholder="وصف الصورة (اختياري)">
        <button class="btn-save" id="saveGalleryBtn">رفع الصورة</button>
      </div>

      <div class="card">
        <h3>صور المعرض الحالية</h3>
        <div id="galleryListAdmin" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;">
          <p class="empty-msg">جاري التحميل...</p>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="toastContainer"></div>

<!-- ============ الاتصال بـ Firebase ============ -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import {
    getAuth,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  import {
    getFirestore,
    collection,
    doc,
    setDoc,
    addDoc,
    updateDoc,
    deleteDoc,
    getDocs,
    query,
    orderBy
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDwBaUQJUA4WII2pa4804-QHjKsAoNa0Xg",
    authDomain: "noor-alhoda-official.firebaseapp.com",
    projectId: "noor-alhoda-official",
    storageBucket: "noor-alhoda-official.firebasestorage.app",
    messagingSenderId: "136003957277",
    appId: "1:136003957277:web:f9a4daba4b87c4cce00cf4"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  /* ---------- دالة إشعارات Toast ---------- */
  function showToast(message, type = "info", duration = 4000){
    const container = document.getElementById("toastContainer");
    const toast = document.createElement("div");
    toast.className = `toast ${type}`;
    const icon = type === "success" ? "✅" : type === "error" ? "⚠️" : "ℹ️";
    toast.innerHTML = `<span>${icon}</span><span>${message}</span>`;
    container.appendChild(toast);
    requestAnimationFrame(() => toast.classList.add("show"));
    setTimeout(() => {
      toast.classList.remove("show");
      setTimeout(() => toast.remove(), 300);
    }, duration);
  }

  const loginScreen = document.getElementById("loginScreen");
  const dashboard = document.getElementById("dashboard");
  /* ---------- تسجيل الدخول ---------- */
  document.getElementById("loginBtn").addEventListener("click", async () => {
    const email = document.getElementById("emailInput").value.trim();
    const password = document.getElementById("passwordInput").value;

    if(!email || !password){
      showToast("من فضلك أدخل البريد وكلمة المرور", "error");
      return;
    }

    const btn = document.getElementById("loginBtn");
    btn.disabled = true;
    btn.innerHTML = "<span class='spinner' style='border-top-color:#fff;'></span> جاري الدخول...";

    try{
      await signInWithEmailAndPassword(auth, email, password);
    }catch(err){
      showToast("بيانات الدخول غير صحيحة", "error");
      btn.disabled = false;
      btn.textContent = "تسجيل الدخول";
    }
  });

  document.getElementById("logoutBtn").addEventListener("click", () => {
    signOut(auth);
  });

  onAuthStateChanged(auth, (user) => {
    if(user){
      loginScreen.style.display = "none";
      dashboard.style.display = "block";
      loadResults();
      loadRegistrations();
      loadNewsAdmin();
      loadGalleryAdmin();
    }else{
      loginScreen.style.display = "flex";
      dashboard.style.display = "none";
    }
  });

  /* ---------- التبويبات ---------- */
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(btn.dataset.tab).classList.add("active");
    });
  });

  /* ---------- إضافة نتيجة ---------- */
  document.getElementById("saveResultBtn").addEventListener("click", async () => {
    const seatId = document.getElementById("seatIdInput").value.trim();
    const studentName = document.getElementById("resStudentName").value.trim();
    const grade = document.getElementById("resGrade").value.trim();
    const status = document.getElementById("resStatus").value;

    if(!seatId || !studentName){
      showToast("أدخل رقم الجلوس واسم الطالب على الأقل", "error");
      return;
    }

    const btn = document.getElementById("saveResultBtn");
    btn.disabled = true;
    btn.innerHTML = "<span class='spinner'></span> جاري الحفظ...";

    try{
      await setDoc(doc(db, "results", seatId), { studentName, grade, status });
      showToast("تم حفظ النتيجة بنجاح", "success");
      document.getElementById("seatIdInput").value = "";
      document.getElementById("resStudentName").value = "";
      document.getElementById("resGrade").value = "";
      loadResults();
    }catch(err){
      showToast("حصل خطأ أثناء الحفظ", "error");
    }finally{
      btn.disabled = false;
      btn.textContent = "حفظ النتيجة";
    }
  });

  async function loadResults(){
    const listEl = document.getElementById("resultsListAdmin");
    listEl.innerHTML = "<p class='empty-msg'>جاري التحميل...</p>";
    try{
      const snapshot = await getDocs(collection(db, "results"));
      if(snapshot.empty){
        listEl.innerHTML = "<p class='empty-msg'>لا توجد نتائج مضافة بعد</p>";
        return;
      }
      listEl.innerHTML = "";
      snapshot.forEach(docSnap => {
        const data = docSnap.data();
        const row = document.createElement("div");
        row.className = "entry-row";
        row.innerHTML = `
          <div class="info"><b>${docSnap.id}</b> — ${data.studentName || ""} — ${data.grade || "-"} — ${data.status || "-"}</div>
          <button class="del-btn" data-id="${docSnap.id}">حذف</button>
        `;
        row.querySelector(".del-btn").addEventListener("click", async () => {
          if(confirm("متأكد من حذف هذه النتيجة؟")){
            await deleteDoc(doc(db, "results", docSnap.id));
            loadResults();
          }
        });
        listEl.appendChild(row);
      });
    }catch(err){
      listEl.innerHTML = "<p class='empty-msg'>تعذر تحميل النتائج</p>";
    }
  }

  /* ---------- تنسيق رقم الهاتف لواتساب (أرقام السودان) ---------- */
  function formatPhoneForWhatsapp(phone){
    let digits = (phone || "").replace(/[^0-9]/g, "");
    if(digits.startsWith("0")) digits = "249" + digits.slice(1);
    else if(!digits.startsWith("249")) digits = "249" + digits;
    return digits;
  }

  function buildWhatsappLink(phone, message){
    const num = formatPhoneForWhatsapp(phone);
    return `https://wa.me/${num}?text=${encodeURIComponent(message)}`;
  }

  /* ---------- طلبات التسجيل ---------- */
  async function loadRegistrations(){
    const listEl = document.getElementById("registrationsListAdmin");
    listEl.innerHTML = "<p class='empty-msg'>جاري التحميل...</p>";
    try{
      const q = query(collection(db, "registrations"), orderBy("createdAt", "desc"));
      const snapshot = await getDocs(q);
      if(snapshot.empty){
        listEl.innerHTML = "<p class='empty-msg'>لا توجد طلبات تسجيل بعد</p>";
        return;
      }
      listEl.innerHTML = "";
      snapshot.forEach(docSnap => {
        const data = docSnap.data();
        const status = data.status || "قيد المراجعة";

        let badgeClass = "status-pending";
        if(status === "مقبول") badgeClass = "status-accepted";
        if(status === "مرفوض") badgeClass = "status-rejected";

        const row = document.createElement("div");
        row.className = "entry-row";
        row.style.flexDirection = "column";
        row.style.alignItems = "stretch";

        const acceptMsg = `السلام عليكم، نفيدكم بأنه تم قبول تسجيل الطالب/ة ${data.studentName || ""} في مدرسة نور الهدى الأساسية المختلطة. نرحب بكم معنا.`;
        const rejectMsg = `السلام عليكم، نأسف لإبلاغكم بأنه لم يتم قبول طلب تسجيل الطالب/ة ${data.studentName || ""} حالياً. للاستفسار برجاء التواصل مع إدارة المدرسة.`;

        row.innerHTML = `
          <div class="info" style="margin-bottom:8px;">
            <span class="status-badge ${badgeClass}">${status}</span>
            <b>${data.studentName || ""}</b> — ولي الأمر: ${data.guardianName || "-"}<br>
            الهاتف: ${data.phone || "-"} — الصف: ${data.grade || "-"}
            ${data.notes ? "<br>ملاحظات: " + data.notes : ""}
          </div>
          <div class="action-buttons">
            <button class="accept-btn">قبول</button>
            <button class="reject-btn">رفض</button>
            <a class="whatsapp-btn" target="_blank">💬 إرسال واتساب</a>
            <button class="del-btn">حذف</button>
          </div>
        `;

        const whatsappBtn = row.querySelector(".whatsapp-btn");
        whatsappBtn.href = buildWhatsappLink(data.phone, status === "مرفوض" ? rejectMsg : acceptMsg);

        row.querySelector(".accept-btn").addEventListener("click", async () => {
          await updateDoc(doc(db, "registrations", docSnap.id), { status: "مقبول" });
          whatsappBtn.href = buildWhatsappLink(data.phone, acceptMsg);
          loadRegistrations();
        });

        row.querySelector(".reject-btn").addEventListener("click", async () => {
          await updateDoc(doc(db, "registrations", docSnap.id), { status: "مرفوض" });
          whatsappBtn.href = buildWhatsappLink(data.phone, rejectMsg);
          loadRegistrations();
        });

        row.querySelector(".del-btn").addEventListener("click", async () => {
          if(confirm("متأكد من حذف هذا الطلب؟")){
            await deleteDoc(doc(db, "registrations", docSnap.id));
            loadRegistrations();
          }
        });

        listEl.appendChild(row);
      });
    }catch(err){
      listEl.innerHTML = "<p class='empty-msg'>تعذر تحميل الطلبات</p>";
    }
  }

  /* ---------- الأخبار ---------- */
  document.getElementById("saveNewsBtn").addEventListener("click", async () => {
    const title = document.getElementById("newsTitle").value.trim();
    const body = document.getElementById("newsBody").value.trim();

    if(!title || !body){
      showToast("أدخل عنوان الخبر ونصه", "error");
      return;
    }

    const btn = document.getElementById("saveNewsBtn");
    btn.disabled = true;
    btn.innerHTML = "<span class='spinner'></span> جاري النشر...";

    try{
      await addDoc(collection(db, "news"), {
        title, body, createdAt: new Date()
      });
      showToast("تم نشر الخبر بنجاح", "success");
      document.getElementById("newsTitle").value = "";
      document.getElementById("newsBody").value = "";
      loadNewsAdmin();
    }catch(err){
      showToast("حصل خطأ أثناء النشر", "error");
    }finally{
      btn.disabled = false;
      btn.textContent = "نشر الخبر";
    }
  });

  async function loadNewsAdmin(){
    const listEl = document.getElementById("newsListAdmin");
    listEl.innerHTML = "<p class='empty-msg'>جاري التحميل...</p>";
    try{
      const q = query(collection(db, "news"), orderBy("createdAt", "desc"));
      const snapshot = await getDocs(q);
      if(snapshot.empty){
        listEl.innerHTML = "<p class='empty-msg'>لا توجد أخبار منشورة بعد</p>";
        return;
      }
      listEl.innerHTML = "";
      snapshot.forEach(docSnap => {
        const data = docSnap.data();
        const row = document.createElement("div");
        row.className = "entry-row";
        row.innerHTML = `
          <div class="info"><b>${data.title || ""}</b><br>${data.body || ""}</div>
          <button class="del-btn">حذف</button>
        `;
        row.querySelector(".del-btn").addEventListener("click", async () => {
          if(confirm("متأكد من حذف هذا الخبر؟")){
            await deleteDoc(doc(db, "news", docSnap.id));
            loadNewsAdmin();
          }
        });
        listEl.appendChild(row);
      });
    }catch(err){
      listEl.innerHTML = "<p class='empty-msg'>تعذر تحميل الأخبار</p>";
    }
  }

  /* ---------- المعرض ---------- */
  function compressImage(file, maxWidth = 900, quality = 0.7){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          if(w > maxWidth){
            h = Math.round(h * (maxWidth / w));
            w = maxWidth;
          }
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  document.getElementById("saveGalleryBtn").addEventListener("click", async () => {
    const fileInput = document.getElementById("galleryFileInput");
    const caption = document.getElementById("galleryCaption").value.trim();
    const file = fileInput.files[0];

    if(!file){
      showToast("من فضلك اختر صورة أولاً", "error");
      return;
    }

    const btn = document.getElementById("saveGalleryBtn");
    btn.disabled = true;
    btn.innerHTML = "<span class='spinner'></span> جاري الرفع...";

    try{
      const imageData = await compressImage(file);

      if(imageData.length > 900000){
        showToast("الصورة كبيرة جداً حتى بعد الضغط، جرب صورة أخرى", "error");
        return;
      }

      await addDoc(collection(db, "gallery"), {
        imageData, caption, createdAt: new Date()
      });

      showToast("تم رفع الصورة بنجاح", "success");
      fileInput.value = "";
      document.getElementById("galleryCaption").value = "";
      loadGalleryAdmin();
    }catch(err){
      showToast("حصل خطأ أثناء الرفع", "error");
    }finally{
      btn.disabled = false;
      btn.textContent = "رفع الصورة";
    }
  });

  async function loadGalleryAdmin(){
    const listEl = document.getElementById("galleryListAdmin");
    listEl.innerHTML = "<p class='empty-msg'>جاري التحميل...</p>";
    try{
      const q = query(collection(db, "gallery"), orderBy("createdAt", "desc"));
      const snapshot = await getDocs(q);
      if(snapshot.empty){
        listEl.innerHTML = "<p class='empty-msg'>لا توجد صور مضافة بعد</p>";
        return;
      }
      listEl.innerHTML = "";
      snapshot.forEach(docSnap => {
        const data = docSnap.data();
        const item = document.createElement("div");
        item.className = "gallery-item";
        item.innerHTML = `
          <img src="${data.imageData}" alt="${data.caption || ''}">
          <button class="del-btn">حذف</button>
        `;
        item.querySelector(".del-btn").addEventListener("click", async () => {
          if(confirm("متأكد من حذف هذه الصورة؟")){
            await deleteDoc(doc(db, "gallery", docSnap.id));
            loadGalleryAdmin();
          }
        });
        listEl.appendChild(item);
      });
    }catch(err){
      listEl.innerHTML = "<p class='empty-msg'>تعذر تحميل الصور</p>";
    }
  }
</script>
